[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultracontacts"
version = "0.1.0"
description = "GPU-accelerated, chemical-group-aware molecular contact analysis"
requires-python = ">=3.10"
dependencies = [
    "mdanalysis>=2.0",
    "numpy",
    "pyarrow",
    "pandas",
    "polars",
    "tqdm",
    "rdkit",
    # cupy is intentionally omitted here — prebuilt wheels are CUDA-version-specific
    # and cannot be auto-selected by pip. Install the matching wheel manually:
    #   pip install cupy-cuda12x   # CUDA 12.x
    #   pip install cupy-cuda13x   # CUDA 13.x
    # or use: pip install ultracontacts[cuda12x]
]

[project.optional-dependencies]
cuda12x = ["cupy-cuda12x"]
cuda13x = ["cupy-cuda13x"]
cuda11x = ["cupy-cuda11x"]
parmed = ["parmed"]

[project.scripts]
ultracontacts = "ultracontacts.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
