[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultracontacts"
version = "0.1.0"
description = "GPU-accelerated, chemical-group-aware molecular contact analysis"
requires-python = ">=3.10"
dependencies = [
    "mdanalysis>=2.0",
    "numpy",
    "pyarrow",
    "pandas",
    "polars",
    "tqdm",
    "rdkit",
    "cupy",  # CUDA-version-specific builds available: cupy-cuda12x, cupy-cuda13x, etc.
             # Install the matching build for your CUDA version before installing ultracontacts.
]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x"]
cuda13 = ["cupy-cuda13x"]
cuda11 = ["cupy-cuda11x"]

[project.scripts]
ultracontacts = "ultracontacts.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
